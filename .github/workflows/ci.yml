# Checks every pull request; deploy.yml (Phase 6) reuses it through workflow_call.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its older run; a deploy's call (run_id) is never cancelled.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6 # same as the laptop

      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/prod init -backend=false -input=false
      - run: terraform -chdir=infra/prod validate
